# Pattern 2 — config catalog. One row per model instance.
# Change this file to onboard a new model; no DAG code change.
models:
  - name: iris_rf
    algorithm: random_forest
    schedule: "0 3 * * *"
    features_uri: "s3://features/iris/"
    quality_gate: 0.90
  - name: iris_xgb
    algorithm: xgboost
    schedule: "0 3 * * *"
    features_uri: "s3://features/iris/"
    quality_gate: 0.92
  - name: churn_lr
    algorithm: logistic_regression
    schedule: "0 5 * * *"
    features_uri: "s3://features/churn/"
    quality_gate: 0.75
